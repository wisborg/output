name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the code. A public repository's
# default token is otherwise writable, which a compromised dependency of an
# action could use.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every leg. Which Go version or system broke is the useful
      # half of the answer, and fail-fast throws it away by cancelling the
      # other jobs.
      fail-fast: false
      matrix:
        include:
          # The floor declared in go.mod. A library's stated minimum is a
          # promise, and the only way to keep it is to build against it --
          # it is otherwise very easy to use something newer and not notice.
          - { os: ubuntu-latest, go: "1.25" }
          # ...and current, so a change in the toolchain shows up here rather
          # than in someone's build.
          - { os: ubuntu-latest, go: stable }
          # The terminal code is three files, one per system, picked by build
          # tag: a mistake in the macOS or Windows one compiles away on Linux
          # and is never run. Windows' was written against the documented API
          # and tested nowhere else. Neither job has a terminal, so what they
          # run is every path that falls back when there is none -- which is
          # what term_windows.go's "fails closed" promises -- with the rest of
          # the tests on that system's files, paths and line endings: Git
          # checks the examples out with CRLF there. Current Go alone, as the
          # floor is a property of the code, not of the system.
          - { os: macos-latest, go: stable }
          - { os: windows-latest, go: stable }
    name: go ${{ matrix.go }} on ${{ matrix.os }}
    defaults:
      run:
        # Git's bash on Windows, so that every step is one script for all
        # three systems.
        shell: bash
    steps:
      # Actions are pinned to a commit SHA, not a tag. A tag is mutable: if
      # the action's repository or a maintainer's account is compromised, v7
      # can be moved to point at anything, and it then runs inside this
      # workflow. The blast radius here is small -- read-only token, no
      # secrets, public code -- but the runner still has network egress and
      # can be used against others. The trailing comment is the human-readable
      # version; update both together, or let Dependabot do it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no business being written
          # into .git/config where every later step can reach it.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # setup-go caches modules by default. The whole dependency graph
          # here is go-runewidth, uax29 and x/image, so the cache saves little
          # while adding a store that is written by one run and read by
          # another -- worth avoiding for the saving involved.
          cache: false

      - name: gofmt
        # Formatting and the layering are the same on every system: once.
        if: runner.os == 'Linux'
        # Capture and test for emptiness rather than piping gofmt into
        # something that decides the exit status. `gofmt -l` exits 0 whether
        # or not it printed a filename, so any check that reads an exit code
        # from a pipeline containing it silently passes on unformatted code.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: layering
        if: runner.os == 'Linux'
        # Each package compiles in only the modules it is meant to, which
        # is a promise to the programs depending on them; see the Makefile.
        run: make deps

      - name: test
        # -race even though the package documents that a Table is not safe for
        # concurrent use: the cost is trivial at this size, and the detector
        # is what would catch a future change that starts sharing state.
        #
        # This also runs the Example functions, whose "// Output:" blocks are
        # the package documentation. That is the main thing this workflow is
        # here for -- documentation that is executable rots silently the
        # moment an output format changes and nobody runs the tests.
        run: go test -race ./...
